<title>SherrByte Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap">
<style>
/* Layout: black canvas, fixed top command bar, scrolling stage, floating bottom dock + side toggle.
   Single-theme by design — the product's identity is a lit black room. */
:root{
  --bg:#000; --lift1:#0d0d10; --lift2:#17171b; --lift3:#202026;
  --hair:rgba(255,255,255,.10); --hair2:rgba(255,255,255,.06);
  --surface:#e6e6e6; --surface-head:#efefef; --surface-rule:rgba(0,0,0,.20);
  --on-surface:#0a0a0a; --on-surface-2:#585860;
  --text:#f4f4f5; --text2:#9a9aa2; --text3:#5e5e67;
  --accent:#3a3aff; --accent-soft:rgba(58,58,255,.30);
  --ok:#35c97a; --warn:#f0a83c; --crit:#ff5b5f; --stale:#6b6b74;
  --fd:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --fb:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --r-card:22px; --r-panel:28px; --r-pill:999px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--fd);font-weight:300;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}

/* ── top chrome ────────────────────────────────────────── */
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;gap:12px;align-items:center;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:linear-gradient(180deg,#0a0a0c 0%,rgba(10,10,12,.92) 70%,rgba(10,10,12,0) 100%)}
.mark{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--lift3);
  border:1px solid var(--hair);display:grid;place-items:center;font-family:var(--fd);font-weight:500;
  font-size:17px;color:#e8a33c;letter-spacing:-.02em}
.cmd{flex:1;min-width:0;height:42px;border-radius:var(--r-pill);background:var(--surface);
  color:var(--on-surface-2);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:14px;
  text-align:left;transition:box-shadow .18s}
.cmd:hover{box-shadow:0 0 0 3px rgba(255,255,255,.10)}
.cmd .k{margin-left:auto;font-size:11px;letter-spacing:.06em;color:#8a8a92;border:1px solid rgba(0,0,0,.18);
  border-radius:5px;padding:2px 6px;flex:0 0 auto}
.cmdtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── stage ─────────────────────────────────────────────── */
.stage{position:relative;min-height:100%;padding:0 16px 210px;max-width:1120px;margin:0 auto;
  padding-top:calc(76px + env(safe-area-inset-top,0px))}
.glyph{display:grid;place-items:center;height:64px;margin:6px 0 2px}
.glyph svg{width:44px;height:44px;opacity:.95}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 6px}
.head h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.02em}
.demo{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#0a0a0a;background:var(--surface);
  border-radius:var(--r-pill);padding:4px 11px;font-weight:500}
.sub{color:var(--text2);font-size:14px;margin:0 0 22px}

/* trust ribbon */
.ribbon{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center;font-size:13px;color:var(--text2);
  border:1px solid var(--hair);border-radius:var(--r-pill);padding:9px 18px;margin:0 0 26px;background:var(--lift1)}
.ribbon b{color:var(--text);font-weight:400}
.ribbon .sep{color:var(--text3);padding:0 10px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}

/* ── data cards (light on black — inverted, per reference) ─ */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:16px;margin:0 0 22px}
.card{background:var(--surface);border-radius:var(--r-card);color:var(--on-surface);text-align:left;
  display:flex;flex-direction:column;overflow:hidden;transition:transform .16s,box-shadow .16s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(0,0,0,.5)}
.card .ch{background:var(--surface-head);border-bottom:1px solid var(--surface-rule);height:42px;
  display:flex;align-items:center;justify-content:flex-end;padding:0 14px}
.card .cb{padding:16px 20px 20px}
.card .lab{font-size:15px;color:var(--on-surface-2);margin:0 0 2px}
.card .val{font-family:var(--fd);font-weight:300;font-size:clamp(38px,6.4vw,54px);line-height:1.08;
  letter-spacing:-.03em;margin:0 0 6px;word-break:break-word}
.card .val.prov{font-weight:200;color:#2a2a30}
.card .cap{font-size:13.5px;color:var(--on-surface-2)}
.pill{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:500;border-radius:var(--r-pill);padding:3px 9px}
.pill.verified{color:#1d7a4a;background:rgba(53,201,122,.16)}
.pill.provisional,.pill.incomplete{color:#8a5500;background:rgba(240,168,60,.22)}
.pill.draft{color:#3a3a44;border:1px solid rgba(0,0,0,.22)}
.pill.stale{color:#55555e;background:rgba(0,0,0,.08)}

/* band label */
.band{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:26px 0 12px;
  display:flex;align-items:center;gap:12px}
.band::after{content:"";flex:1;height:1px;background:var(--hair2)}

/* ── attention panel ───────────────────────────────────── */
.panel{border:1px solid var(--hair);border-radius:var(--r-panel);background:var(--lift1);overflow:hidden}
.panel>h3{font-size:17px;padding:18px 22px 14px;border-bottom:1px solid var(--hair2)}
.exc{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--hair2);
  width:100%;text-align:left;transition:background .14s}
.exc:last-child{border-bottom:none}
.exc:hover{background:var(--lift2)}
.exc .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:500;background:var(--lift3);color:var(--text)}
.exc .n.crit{background:rgba(255,91,95,.20);color:#ff9a9d}
.exc .n.warn{background:rgba(240,168,60,.18);color:#f3c078}
.exc .t{flex:1;min-width:0}
.exc .t b{font-weight:400;display:block}
.exc .t span{font-size:13px;color:var(--text2)}
.exc .amt{flex:0 0 auto;font-family:var(--fd);font-size:16px;color:var(--text);font-weight:300}

/* ── input screen ──────────────────────────────────────── */
.drop{border:2px solid var(--accent);border-radius:var(--r-panel);background:var(--lift1);
  box-shadow:0 0 46px var(--accent-soft);padding:26px;margin:0 0 20px}
.target{border:2px dashed rgba(255,255,255,.55);border-radius:26px;min-height:190px;display:grid;
  place-items:center;text-align:center;padding:24px}
.target .t1{font-family:var(--fd);font-size:clamp(26px,4.4vw,34px);font-weight:300;display:flex;align-items:center;gap:14px}
.target .t2{font-size:13.5px;color:var(--text2);margin-top:8px}
.itype{margin:20px auto 0;max-width:430px;height:44px;border-radius:var(--r-pill);background:var(--lift3);
  border:1px solid var(--hair);color:var(--text);padding:0 18px;width:100%;font-family:var(--fb);font-size:14px}
.itype::placeholder{color:var(--text3)}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 0 0}
.chip{border:1px solid var(--hair);border-radius:var(--r-pill);padding:8px 15px;font-size:13.5px;
  color:var(--text2);transition:.14s}
.chip:hover{border-color:rgba(255,255,255,.3);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--on-surface);border-color:var(--surface)}

/* ── folder grid ───────────────────────────────────────── */
.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px 18px;margin:8px 0 0}
.folder{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 8px;border-radius:18px;transition:.16s}
.folder:hover{background:var(--lift1)}
.folder .fi{position:relative;width:118px;height:88px}
.folder svg{width:100%;height:100%}
.folder .badge{position:absolute;top:16px;right:6px;background:var(--surface);color:var(--on-surface);
  border-radius:var(--r-pill);font-size:11px;font-weight:500;padding:2px 8px}
.folder .fl{font-family:var(--fd);font-weight:300;font-size:19px;text-align:center}
.folder .fs{font-size:12.5px;color:var(--text3);text-align:center;margin-top:-6px}

/* ── generic list / table ──────────────────────────────── */
.rows{width:100%;border-collapse:collapse;font-size:14px}
.rows th{text-align:left;font-weight:400;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text3);padding:0 14px 10px;border-bottom:1px solid var(--hair2)}
.rows td{padding:13px 14px;border-bottom:1px solid var(--hair2);color:var(--text2)}
.rows tr:last-child td{border-bottom:none}
.rows td:first-child{color:var(--text)}
.rows .r{text-align:right}
.scroll{overflow-x:auto;padding:18px 8px 6px}
.ok-t{color:var(--ok)} .warn-t{color:var(--warn)} .crit-t{color:var(--crit)} .stale-t{color:var(--stale)}

/* ── stages diagram ────────────────────────────────────── */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin:0 0 24px}
.st{border:1px solid var(--hair);border-radius:16px;padding:14px;background:var(--lift1);text-align:left}
.st .sn{font-family:var(--fd);font-size:30px;font-weight:300;line-height:1}
.st .sl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-top:6px}
.st.hot{border-color:rgba(240,168,60,.5)} .st.hot .sn{color:var(--warn)}

/* ── trace drawer ──────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.trace{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:61;background:var(--lift1);
  border-left:1px solid var(--hair);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;overflow:hidden}
.trace.on{transform:none}
.trace .th{padding:20px 22px 16px;border-bottom:1px solid var(--hair2);display:flex;gap:14px;align-items:flex-start;
  padding-top:calc(20px + env(safe-area-inset-top,0px))}
.trace .th h3{font-size:20px;flex:1;min-width:0}
.trace .tb{overflow-y:auto;padding:0 22px 28px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.trace .bigv{font-family:var(--fd);font-weight:300;font-size:46px;letter-spacing:-.03em;margin:18px 0 4px}
.meta{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;font-size:13px;margin:16px 0 22px}
.meta dt{color:var(--text3)} .meta dd{margin:0;color:var(--text2)}
.meta dd code{font-family:ui-monospace,monospace;font-size:12px;color:var(--text2)}
.note{border-left:2px solid var(--warn);padding:10px 14px;background:rgba(240,168,60,.07);font-size:13.5px;
  color:#e8c491;border-radius:0 8px 8px 0;margin:0 0 20px}
.tsec{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--text3);margin:22px 0 10px}
.tline{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair2);font-size:14px}
.tline .d{flex:1;min-width:0}
.tline .d b{font-weight:400;display:block}
.tline .d span{font-size:12.5px;color:var(--text3)}
.tline .v{font-family:var(--fd);font-weight:300;white-space:nowrap}
.sumline{display:flex;justify-content:space-between;padding:14px 0 0;font-size:14px;color:var(--ok)}
.docview{border:1px solid var(--hair);border-radius:14px;background:var(--lift2);padding:16px;margin-top:12px;font-size:13px}
.docview .dl{display:flex;justify-content:space-between;padding:5px 0;color:var(--text2)}
.docview .hl{background:rgba(58,58,255,.28);outline:1px solid var(--accent);border-radius:4px;padding:2px 7px;color:var(--text)}
.close{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--lift3);display:grid;place-items:center;font-size:17px;color:var(--text2)}
.close:hover{color:var(--text)}

/* ── bottom dock ───────────────────────────────────────── */
.dockwrap{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;justify-items:center;gap:12px;
  padding:0 16px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dockwrap::before{content:"";position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);
  width:min(560px,92vw);height:230px;background:radial-gradient(ellipse at center,rgba(255,255,255,.13),transparent 68%);
  pointer-events:none}
.dock{position:relative;pointer-events:auto;display:flex;background:rgba(46,46,52,.86);backdrop-filter:blur(14px);
  border-radius:var(--r-pill);padding:5px;gap:2px;border:1px solid var(--hair)}
.seg{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 22px;border-radius:var(--r-pill);
  font-size:12px;color:#c9c9d0;transition:.18s;min-width:84px}
.seg svg{width:22px;height:22px}
.seg[aria-selected="true"]{background:var(--surface);color:var(--on-surface);box-shadow:0 0 22px rgba(255,255,255,.3)}
.sidetoggle{position:relative;pointer-events:auto;display:flex;gap:6px;background:rgba(46,46,52,.8);
  border-radius:var(--r-pill);padding:5px 7px;border:1px solid var(--hair)}
.sd{width:11px;height:11px;border-radius:50%;background:#55555e;transition:.18s}
.sd[aria-selected="true"]{background:var(--surface)}

@media (max-width:640px){
  .stage{padding-bottom:230px}
  .seg{padding:9px 14px;min-width:70px;font-size:11px}
  .meta{grid-template-columns:96px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="mark" aria-hidden="true">S</div>
  <button class="cmd" onclick="alert0()"><span class="cmdtxt">Search invoices, customers, reports — or type an action</span><span class="k">⌘K</span></button>
</header>

<main class="stage" id="stage"></main>

<div class="scrim" id="scrim" onclick="closeTrace()"></div>
<aside class="trace" id="trace" role="dialog" aria-modal="true" aria-label="Number trace"></aside>

<div class="dockwrap">
  <nav class="dock" id="dock" role="tablist" aria-label="Section"></nav>
  <div class="sidetoggle" role="tablist" aria-label="Side">
    <button class="sd" role="tab" id="sd0" aria-selected="true" aria-label="Workspace" onclick="setSide(0)"></button>
    <button class="sd" role="tab" id="sd1" aria-selected="false" aria-label="Company" onclick="setSide(1)"></button>
  </div>
</div>

<script>

const alert0 = () => {};

/* ---- icons ---- */
const I = {

};

/* ---- example dataset: Shree Balaji Traders, September 2026 ---- */
const M = {

/* ---- trace drawer ---- */
function openTrace(k){
  const m=M[k], el=document.getElementById('trace');
  const sum=m.items.reduce((a,b)=>a+b.v,0);
  el.innerHTML=`<div class="th"><h3>${m.label}</h3>
      ${m.status==='verified'?'<span class="pill verified">verified</span>':`<span class="pill ${m.status}">${m.status}</span>`}
      <button class="close" onclick="closeTrace()" aria-label="Close">✕</button></div>
    <div class="tb">
      <div class="bigv tnum">${m.val}</div>
      <div style="color:var(--text3);font-size:13px">${rs(m.exact)} exact · as of 30 Sep 2026 18:30 IST</div>
      ${m.note?`<div class="note" style="margin-top:18px">${m.note}</div>`:''}
      <dl class="meta">
        <dt>Formula</dt><dd>${m.formula}</dd>
        <dt>Version</dt><dd><code>${m.ver}</code></dd>
        <dt>Sources</dt><dd>${m.srcs}</dd>
        <dt>Refresh</dt><dd>${m.refresh}</dd>
      </dl>
      <div class="tsec">Contributing records</div>
      ${m.items.map(i=>`<div class="tline"><span class="d"><b>${i.t}</b><span>${i.s}</span></span>
        <span class="v tnum">${i.v<0?'−':''}${rs(Math.abs(i.v))}</span></div>`).join('')}
      <div class="sumline"><span>Sum of listed records</span><span class="tnum">${sum<0?'−':''}${rs(Math.abs(sum))} ✓ matches</span></div>
      <div class="tsec">Source evidence</div>
      <div class="docview"><div style="color:var(--text);margin-bottom:10px">${m.doc.title}</div>
        ${m.doc.lines.map(l=>`<div class="dl"><span>${l[0]}</span><span class="tnum">${l[1]}</span></div>`).join('')}
        <div class="dl" style="margin-top:6px"><span>${m.doc.hl[0]}</span><span class="hl tnum">${m.doc.hl[1]}</span></div>
      </div>
      <div style="font-size:12.5px;color:var(--text3);margin-top:12px">
        Extracted region highlighted · confidence 0.99 · method native_pdf · arithmetic check passed<br>
        Approved by Priya S. (accountant)
      </div>
    </div>`;
  el.classList.add('on'); document.getElementById('scrim').classList.add('on');
}
function closeTrace(){document.getElementById('trace').classList.remove('on');document.getElementById('scrim').classList.remove('on');}
addEventListener('keydown',e=>{if(e.key==='Escape')closeTrace();});

  document.getElementById('sd0').setAttribute('aria-selected',side===0);
  document.getElementById('sd1').setAttribute('aria-selected',side===1);
}
function render(){document.getElementById('stage').innerHTML=SCREENS[tab]();scrollTo(0,0);renderDock();}
function setTab(t){tab=t;render();}
function setSide(s){side=s;tab=SIDES[s].segs[0][0];render();}

side=1; tab='dash'; render();
